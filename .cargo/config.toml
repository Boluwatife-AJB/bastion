
# Target-specific linkers 
[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"

# Release profile 
# Applied when running `cargo build --release`
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Flamegraph profile 
# `cargo build --profile flamegraph`
# Release speed + debug symbols for readable flamegraphs
[profile.flamegraph]
inherits = "release"
debug = 1
strip = "none"