[package]
name = "bastion"
version = "0.1.0"
edition = "2024"
authors = ["Boluwatife Ajose <boluwatife.ajose@gmail.com>"]
description = "A production-grade HTTP load testing and benchmarking tool"
license = "MIT"
repository = "https://github.com/Boluwatife-AJB/bastion"
keywords = [
  "load testing",
  "benchmarking",
  "http",
  "testing",
  "benchmark",
  "performance",
]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "bastion"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
hyper = { version = "1.9.0", features = ["client", "http1", "http2"]}
hyper-util ={ version = "0.1.20", features = ["client", "client-legacy", "http1", "http2", "tokio"]}
http-body-util = "0.1.3"
hyper-rustls = { version = "0.27.9", features = ["http1", "http2", "native-tokio"]}
rustls = "0.23.40"
tower = { version = "0.5.1", features = ["util"] }
tower-service = "0.3"
hickory-resolver = { version = "0.26.1", features = ["tokio"] }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "gzip",
  "rustls",
] }
clap = { version = "4.6.1", features = ["derive", "env"] }
hdrhistogram = "7"
governor = "0.10.4"
nonzero_ext = "0.3"
anyhow = "1.0.102"
thiserror = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
csv = "1.4.0"
indicatif = { version = "0.18.4", features = ["rayon"] }
console = "0.16.3"
comfy-table = "7.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
humantime = "2.3.0"
bytes = "1"
tokio-stream = { version = "0.1.18", features = ["sync"]}
futures = "0.3.32"
crossterm = "0.29.0"


[dev-dependencies]
wiremock = "0.6.5"
tokio-test = "0.4.5"
criterion = { version = "0.8", features = ["async_tokio"] }

# [[bench]]
# name = "histogram_bench"
# harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"


[profile.dev]
opt-level = 0
debug = true
