name: Benchmarks

on:
  schedule:
    - cron: '0 2 * * 1'    
  workflow_dispatch:   
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benches/**'

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: |
          cargo bench --bench histogram -- --output-format bencher \
            | tee bench_histogram.txt

          cargo bench --bench metrics_pipeline -- --output-format bencher \
            | tee bench_pipeline.txt

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Bastion Benchmarks
          tool: cargo
          output-file-path: bench_histogram.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          
          alert-threshold: '110%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@Boluwatife-AJB'