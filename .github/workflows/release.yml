name: Release

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  BINARY_NAME: bastion

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')

          echo "Tag version: $TAG"
          echo "Cargo version: $CARGO_VERSION"

          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "ERROR:Tag v$TAG does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: validate-version
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (musl)
          - target: x86_64-unknown-linux-musl
            use_cross: true
            os: ubuntu-latest
            archive_ext: tar.gz

          # Linux ARM64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            archive_ext: tar.gz

          # Linux ARM64 (GNU)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            archive_ext: tar.gz

          # MacOS Intel
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            archive_ext: tar.gz

          # MacOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            archive_ext: tar.gz

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            archive_ext: .exe 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.target }}"
      
      - name: Install cross (Linux cross-compilation)
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Install ARM64 target for macOS universal binary
        if: matrix.target == 'aarch64-apple-darwin'
        run: rustup target add aarch64-apple-darwin

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --target ${{ matrix.target }} --release
          else
            cargo build --target ${{ matrix.target }} --release
          fi
      
      - name: Create macOS universal binary
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          cargo build --release --target aarch64-apple-darwin
          lipo -create \
            target/x86_64-apple-darwin/release/${{ env.BINARY_NAME }} \
            target/aarch64-apple-darwin/release/${{ env.BINARY_NAME }} \
            -output target/universal-apple-darwin/${{ env.BINARY_NAME }}
          mkdir -p target/universal-apple-darwin

      - name: Determine binary path
        shell: bash
        id: binary
        run: |
          SUFFIX="${{ matrix.binary_suffix }}"
          echo "path=target/${{ matrix.target }}/release/${BINARY_NAME}${SUFFIX}" \
            >> $GITHUB_OUTPUT

      - name: Verify binary runs
        shell: bash
        run: |
          ${{ steps.binary.outputs.path }} --version
        if: "!matrix.use_cross"

      - name: Get version from tag
        shell: bash
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Package (tar.gz — Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE="${BINARY_NAME}-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          BINARY_PATH="${{ steps.binary.outputs.path }}"

          # Include: binary, README, LICENSE, CHANGELOG
          tar -czf "$ARCHIVE" \
            -C "$(dirname $BINARY_PATH)" "$(basename $BINARY_PATH)" \
            README.md \
            LICENSE \
            CHANGELOG.md

          # Generate SHA256 checksum
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "archive=${ARCHIVE}" >> $GITHUB_OUTPUT
          echo "checksum=${ARCHIVE}.sha256" >> $GITHUB_OUTPUT
        id: package_unix

      - name: Package (zip — Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $archive = "${{ env.BINARY_NAME }}-${version}-${{ matrix.target }}.zip"
          $binary = "${{ steps.binary.outputs.path }}"

          Compress-Archive -Path $binary, README.md, LICENSE, CHANGELOG.md `
            -DestinationPath $archive

          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "${hash}  ${archive}" | Out-File -Encoding utf8 "${archive}.sha256"

          echo "archive=${archive}" >> $env:GITHUB_OUTPUT
          echo "checksum=${archive}.sha256" >> $env:GITHUB_OUTPUT
        id: package_windows

      - name: Upload artifact (Unix)
        if: matrix.archive_ext == 'tar.gz'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: |
            ${{ steps.package_unix.outputs.archive }}
            ${{ steps.package_unix.outputs.checksum }}
          retention-days: 1

      - name: Upload artifact (Windows)
        if: matrix.archive_ext == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: |
            ${{ steps.package_windows.outputs.archive }}
            ${{ steps.package_windows.outputs.checksum }}
          retention-days: 1
      
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff
    
      - name: Generate changelog for this release
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          # Generate changelog from the previous tag to this one
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            git cliff "$PREV_TAG"..HEAD --strip header > RELEASE_NOTES.md
          else
            git cliff --strip header > RELEASE_NOTES.md
          fi

          echo "Generated release notes:"
          cat RELEASE_NOTES.md

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }} 
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
          generate_release_notes: false 

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    # Only publish non-prerelease versions
    if: "!contains(github.ref_name, '-')"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}